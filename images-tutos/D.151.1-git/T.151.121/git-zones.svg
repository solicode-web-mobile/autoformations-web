<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="300" fill="#ffffff" rx="8"/>
  
  <!-- Boxes -->
  <!-- Box 1 -->
  <rect x="40" y="80" width="180" height="140" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="3"/>
  <text x="130" y="145" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0d47a1" text-anchor="middle">Dossier de</text>
  <text x="130" y="170" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0d47a1" text-anchor="middle">travail</text>

  <!-- Box 2 -->
  <rect x="310" y="80" width="180" height="140" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="3"/>
  <text x="400" y="145" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1b5e20" text-anchor="middle">Zone de</text>
  <text x="400" y="170" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1b5e20" text-anchor="middle">préparation</text>

  <!-- Box 3 -->
  <rect x="580" y="80" width="180" height="140" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="3"/>
  <text x="670" y="145" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100" text-anchor="middle">Dépôt Git</text>
  <text x="670" y="170" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14" fill="#e65100" text-anchor="middle">(Historique)</text>

  <!-- Arrows -->
  <!-- Arrow 1 to 2 -->
  <path d="M 220 150 L 295 150" fill="none" stroke="#607d8b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="257" y="140" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="bold" fill="#455a64" text-anchor="middle">git add</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 490 150 L 565 150" fill="none" stroke="#607d8b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="527" y="140" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="bold" fill="#455a64" text-anchor="middle">git commit</text>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/>
    </marker>
  </defs>
</svg>
