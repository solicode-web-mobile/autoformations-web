<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: "Console" }}</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: "Consolas", "Courier New", monospace;
            padding: 20px;
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
        }
        /* Utilitaires pour formater manuellement le texte console */
        .comment { color: #6a9955; }
        .command { color: #ce9178; }
        .output { color: #9cdcfe; }
        .prompt { color: #569cd6; font-weight: bold; }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
