<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Résultat" }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            padding: 2rem 1.5rem 3rem;
            font-size: 14px;
            line-height: 1.65;
        }

        /* ── En-tête ─────────────────────────────── */
        .conception-header {
            margin-bottom: 1.75rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #2673e8;
        }

        .conception-tuto-id {
            display: inline-block;
            background: #e0edff;
            color: #1c5bba;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            margin-bottom: 0.5rem;
        }

        .conception-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.3;
        }

        /* ── Contenu ─────────────────────────────── */
        .conception-content h2 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
            margin: 1.5rem 0 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .conception-content h2::before {
            content: '';
            display: block;
            width: 4px;
            height: 14px;
            background: #2673e8;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .conception-content p {
            font-size: 0.875rem;
            color: #475569;
            margin-bottom: 0.75rem;
        }

        .conception-content hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 1.25rem 0;
        }

        /* ── Tableaux ────────────────────────────── */
        .conception-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            border-radius: 0.6rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 1rem;
        }

        .conception-content thead {
            background: #1e3a5f;
            color: #fff;
        }

        .conception-content thead th {
            padding: 0.65rem 0.9rem;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .conception-content tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.12s;
        }

        .conception-content tbody tr:hover {
            background: #f0f6ff;
        }

        .conception-content tbody td {
            padding: 0.6rem 0.9rem;
            color: #334155;
            vertical-align: middle;
        }

        .conception-content code {
            background: #e0edff;
            color: #1c5bba;
            font-size: 0.76rem;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            font-weight: 700;
        }
    </style>
</head>
<body>

    {% if page.tuto_id or page.title %}
    <header class="conception-header">
        {% if page.tuto_id %}
        <span class="conception-tuto-id">{{ page.tuto_id }}</span>
        {% endif %}
        {% if page.title %}
        <h1>{{ page.title }}</h1>
        {% endif %}
    </header>
    {% endif %}

    <div class="conception-content">
        {{ content }}
    </div>

</body>
</html>
