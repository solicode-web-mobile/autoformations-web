<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donnée Persistante</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-window {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .header {
            background-color: #1e293b;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        .close-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }
        .content {
            padding: 20px;
            text-align: center;
            min-height: 100px;
        }
        .data-item {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #f59e0b;
            font-size: 16px;
            color: #334155;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .actions {
            background-color: #f8fafc;
            padding: 15px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        button {
            padding: 8px 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2563eb;
        }
        .closed-state {
            display: none;
            padding: 40px 20px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="app-window" id="app">
        <div class="header">
            <span>Mon Application de Blog</span>
            <span class="close-btn" id="btn-close">✖</span>
        </div>
        <div class="content">
            <div style="font-size: 13px; color: #64748b; margin-bottom: 10px;">Article sauvegardé :</div>
            <div class="data-item">Mon premier article</div>
            <div style="font-size: 12px; color: #10b981;">Donnée stockée de manière persistante</div>
        </div>
    </div>

    <div class="app-window closed-state" id="desktop">
        <p>L'application est fermée.</p>
        <button id="btn-open">Rouvrir l'application</button>
    </div>

    <script>
        const app = document.getElementById('app');
        const desktop = document.getElementById('desktop');
        const btnClose = document.getElementById('btn-close');
        const btnOpen = document.getElementById('btn-open');

        btnClose.addEventListener('click', () => {
            app.style.display = 'none';
            desktop.style.display = 'block';
        });

        btnOpen.addEventListener('click', () => {
            desktop.style.display = 'none';
            app.style.display = 'block';
        });
    </script>
</body>
</html>
