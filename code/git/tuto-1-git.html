<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultat Tuto 1 Git</title>
    <style>
        body { font-family: monospace; background-color: #1e1e1e; color: #d4d4d4; padding: 20px; line-height: 1.5; }
        .comment { color: #6a9955; }
        .command { color: #ce9178; }
    </style>
</head>
<body>
    <span class="comment"># 1. Vérifier que Git est bien installé</span><br>
    <span class="command">git --version</span><br><br>
    <span class="comment"># 2. Configurer son prénom et nom (votre signature)</span><br>
    <span class="command">git config --global user.name "Prénom Nom"</span><br><br>
    <span class="comment"># 3. Configurer son adresse email</span><br>
    <span class="command">git config --global user.email "email@exemple.com"</span>
</body>
</html>
