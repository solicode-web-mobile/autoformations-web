<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Blog</title>
    <style>
        /* css/global.css */
        * {
            box-sizing: border-box;
        }

        /* css/pages.css */
        .section-articles {
            padding: 80px 24px;
        }
        .conteneur-articles {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* css/components.css */
        .carte-article {
            width: 300px;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            margin-bottom: 24px;
        }
        .carte-contenu {
            padding: 20px;
        }
        .carte-contenu h3 {
            margin: 0;
            font-family: sans-serif;
            font-size: 20px;
        }
        .carte-contenu p {
            margin: 12px 0;
            font-family: sans-serif;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <section class="section-articles">
        <div class="conteneur-articles">
            <div class="carte-article">
                <div class="carte-contenu">
                    <h3>Comment bien débuter avec Tailwind CSS ?</h3>
                    <p>Découvrez les concepts fondamentaux de Tailwind CSS.</p>
                </div>
            </div>
            <div class="carte-article">
                <div class="carte-contenu">
                    <h3>L'importance des micro-interactions</h3>
                    <p>Comprendre comment animer de petites actions.</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
