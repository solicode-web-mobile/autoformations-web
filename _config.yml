title: Autoformations Web
description: Autoformations
theme: just-the-docs
url: https://solicode-web-mobile.github.io/autoformations-web/
repository: solicode-web-mobile/autoformations-web

aux_links:
  solicode.co: https://solicode.co/
aux_links_new_tab: true

search_enabled: true
nav_enabled: true
heading_anchors: true
enable_copy_code_button: true
nav_error_report: true 

mermaid:
  version: "9.1.6"

# Activer le menu collapsible
show_collapsed: true

# Afficher le logo (optionnel)
# logo: /assets/images/logo-solicode.svg

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y at %I:%M %p" # uses ruby's time format

# Footer "Edit this page on GitHub" link text
gh_edit_link: true # show or hide edit this page link
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/solicode-web-mobile/autoformations-web" # the github URL for your repo
gh_edit_branch: "main" # the branch that your docs is served from
# gh_edit_source: docs # the source that your files originate from
gh_edit_view_mode: "tree" # "tree" or "edit" if you want the user to jump into the editor immediately

callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# ==========================================
# CONFIGURATION DES COLLECTIONS (AJOUTS)
# ==========================================

# 1. Déclaration standard pour Jekyll
collections:
  sessions:
    output: true
    permalink: /sessions/:slug/
  competences:
    output: true
    permalink: /competences/:slug/
  domaines:
    output: true
    permalink: /formations/:slug/
  tutos:
    output: true
    permalink: /tutos/:path/

# 2. Gestion de l'affichage dans le menu latéral Just the Docs
just_the_docs:
  collections:
    sessions:
      name: "Parcours par Sessions"
      nav_exclude: false
    competences:
      name: "Référentiel de Compétences"
      nav_exclude: true
    domaines:
      name: "Formations"
      nav_exclude: false
    tutos:
      nav_exclude: true